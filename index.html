<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Las Eras de Nemo 🔮</title>
<meta name="description" content="Una tirada de tarot para Nemo">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.85em%22 font-size=%2290%22>🔮</text></svg>">

<body>

  <!-- fondo místico -->
  <div class="bg-mystic" aria-hidden="true"></div>
  <div id="stars" class="stars" aria-hidden="true"></div>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

        <div class="card-fan">
          <div class="mini-card mc1"></div>
          <div class="mini-card mc2"></div>
          <div class="mini-card mc3"></div>
        </div>

      <div id="witch-dialogue" class="dialogue-box">
        <p id="witch-text" class="dialogue-text"></p>
        <p class="tap-hint" id="witch-hint">tocá para continuar ▾</p>
      </div>
    </section>

    <!-- PANTALLA 2: LA TIRADA -->
    <section id="reading-screen" class="screen">
      <div id="progress-dots" class="progress-dots"></div>

      <div id="card-stage" class="card-stage">
        <div id="tarot-card" class="tarot-card">
          <div class="tarot-card-inner">
            <div class="tarot-face tarot-back"></div>
            <div class="tarot-face tarot-front">
              <img id="tarot-front-img" src="" alt="">
            </div>
          </div>
        </div>
        <p class="tap-hint" id="card-hint">tocá la carta ▾</p>
      </div>

      <div id="reading-dialogue" class="dialogue-box is-hidden">
        <p id="reading-text" class="dialogue-text"></p>
        <p class="tap-hint" id="reading-hint">tocá para continuar ▾</p>
      </div>
    </section>

    <!-- PANTALLA 3: MENSAJE FINAL -->
    <section id="final-screen" class="screen">
      <div class="card final-card">
        <p class="eyebrow">🔮 fin de la tirada 🔮</p>
        <h2 class="script-title" id="final-message">¡Feliz cumpleaños! Veo una vida brillante, con muchas eras más ✨</h2>
        <p class="final-sub" id="final-submessage">Tu regalo está en MP 🎁</p>
        <p class="final-joke" id="final-joke">(ahre que siempre regalaban lo mismo 😂)</p>
        <button id="replay-btn" class="btn btn-ghost">Leer de nuevo 🔮</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
